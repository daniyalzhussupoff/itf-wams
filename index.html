<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Всемирная академия горных наук (ВАГН)</title>
<meta name="description" content="Всемирная академия горных наук (ВАГН) — независимая международная научная организация, объединяющая национальные академии горных наук стран-участниц. С 2018 года, Астана.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/family.css?v=8">
<link rel="stylesheet" href="css/wams.css?v=314">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
  <section class="whero">
    <div class="whero__t"><div class="wrap">
      <span class="kick" data-i18n="home.kick"></span>
      <h1><span data-i18n="home.h1a"></span> <span data-i18n="home.h1b"></span></h1>
      <p class="whero__sub" data-i18n="home.sub"></p>
      <div class="whero__cta">
        <a class="btn btn--solid" href="academies.html" data-i18n="cta.academies"></a>
        <a class="btn" href="about.html" data-i18n="cta.about"></a>
      </div>
      <div class="whero__nums reveal" id="hero-nums"></div>
    </div></div>
    <figure class="whero__ph"><div class="wrap">
      <img src="assets/media/2024/01/WhatsApp-Image-2022-09-22-at-15.01.57-1.jpeg"
           alt="Панорама карьера, визит делегации ВАГН в Монголию, сентябрь 2022">
      <figcaption data-i18n="home.heroCap"></figcaption>
    </div></figure>
    <div class="ticker"><div id="ticker"></div></div>
  </section>

  <section class="sheet sheet--white sheet--first"><div class="wrap">
    <div class="sec__head"><h2 data-i18n="about.h1"></h2><a class="btn" href="about.html" data-i18n="cta.about"></a></div>
    <div class="figs figs--swipe">
      <div class="fig fig--flat"><b class="fig__n mono" data-count="2018">2018</b><i class="fig__rule"></i><span class="fig__l" data-i18n="stat.year.l"></span></div>
      <div class="fig fig--flat"><b class="fig__n mono" data-count="8">8</b><i class="fig__rule"></i><span class="fig__l" data-i18n="stat.acad.l"></span></div>
      <div class="fig fig--flat"><b class="fig__n mono" data-count="4">4</b><i class="fig__rule"></i><span class="fig__l" data-i18n="sec.dirs.k"></span></div>
      <div class="fig fig--flat"><b class="fig__n" data-i18n="stat.hq.v"></b><i class="fig__rule"></i><span class="fig__l" data-i18n="stat.hq.l"></span></div>
    </div>
  </div></section>

  <section class="sheet sheet--sand"><div class="wrap">
    <div class="sec__head">
      <div><span class="kick" data-i18n="sec.dirs.k"></span><h2 data-i18n="sec.dirs.h"></h2></div>
      <p class="note" data-i18n="sec.dirs.note"></p>
    </div>
    <div class="cards cards--2" id="dirs"></div>
  </div></section>

  <section class="sheet sheet--white"><div class="wrap">
    <div class="mission reveal">
      <span class="kick" data-i18n="mission.k"></span>
      <p id="mission-p"></p>
    </div>
  </div></section>

  <section class="sheet sheet--sand sheet--tight"><div class="wrap">
    <div class="sec__head">
      <div><span class="kick" data-i18n="sec.acad.k"></span><h2 data-i18n="sec.acad.h"></h2></div>
      <p class="note" data-i18n="sec.acad.note"></p>
    </div>
    <div class="ledger reveal" id="acad"></div>

    <div class="ctab">
      <h2 data-i18n="cta.h"></h2>
      <a class="btn btn--solid" href="contacts.html" data-i18n="cta.join"></a>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="js/i18n.js?v=310"></script><script src="js/content.js?v=200"></script><script src="js/wams.js?v=314"></script>
</body>
</html>
