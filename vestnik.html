<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вестник НАГН — Научный журнал</title>
<meta name="description" content="Вестник НАГН — рецензируемый научный журнал академии по горному делу и наукам о Земле.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="assets/nagn-favicon.png">
<script>document.documentElement.classList.add("js");try{document.documentElement.dataset.theme=localStorage.getItem("nagn_theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nagn.css?v=1">
</head>
<body data-page="vestnik">
<script src="js/preloader.js"></script>
<div id="kn-header"></div>

<main>
<section class="phero"><div class="wrap phero__in reveal">
  <h1 data-i18n="p.vestnik.t">Вестник НАГН</h1>
  <p class="phero__lead" data-i18n="p.vestnik.l"></p>
</div></section>

<section class="sec"><div class="wrap prose reveal">
  <p class="big" data-i18n="vestnik.body"></p>
</div></section>

<section class="sec sec--alt"><div class="wrap">
  <h2 class="h2 reveal" style="margin:0 0 clamp(24px,3.4vw,40px)" data-i18n="sec.issues">Выпуски Вестника</h2>
  <div class="issues reveal">
    <div class="issue"><span class="vol">Том XII · 2025</span><b>Геотехнологии и недропользование</b></div>
    <div class="issue"><span class="vol">Том XI · 2024</span><b>Обогащение и металлургия</b></div>
    <div class="issue"><span class="vol">Том X · 2023</span><b>Безопасность и экология недр</b></div>
    <div class="issue"><span class="vol">Том IX · 2022</span><b>Геомеханика массива</b></div>
  </div>
</div></section>
</main>

<div id="kn-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
