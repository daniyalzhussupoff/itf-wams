<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Структура — НАГН</title>
<meta name="description" content="Структура и руководство Национальной академии горных наук: Президиум, президент, администрация.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="assets/nagn-favicon.png">
<script>document.documentElement.classList.add("js");try{document.documentElement.dataset.theme=localStorage.getItem("nagn_theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nagn.css?v=1">
</head>
<body data-page="structure">
<script src="js/preloader.js"></script>
<div id="kn-header"></div>

<main>
<section class="phero"><div class="wrap phero__in reveal">
  <h1 data-i18n="p.structure.t">Структура и руководство</h1>
  <p class="phero__lead" data-i18n="p.structure.l"></p>
</div></section>

<section class="sec"><div class="wrap">
  <div class="struct-grid">
    <div class="reveal">
      <p class="serifital" style="font-size:clamp(24px,4vw,44px);line-height:1.14;letter-spacing:-.012em;margin:0" data-i18n="lead.note"></p>
    </div>
    <div class="person reveal">
      <div class="person__av">РН</div>
      <div><h3 data-i18n="lead.name">Рыспанов Нурлан Бектасович</h3><span data-i18n="lead.role">Президент НАГН</span></div>
    </div>
  </div>
</div></section>

<section class="sec sec--alt"><div class="wrap">
  <h2 class="h2 reveal" style="margin:0 0 clamp(24px,3.4vw,40px)" data-i18n="sec.pres">Президиум</h2>
  <div class="mgrid reveal">
    <div class="mcard"><div class="av">РН</div><b>Рыспанов Н. Б.</b><span>Президент</span></div>
    <div class="mcard"><div class="av">МА</div><b>Мукушева А. С.</b><span>Учёный секретарь</span></div>
    <div class="mcard"><div class="av">•</div><b>Вице-президент</b><span>Геомеханика</span></div>
    <div class="mcard"><div class="av">•</div><b>Член Президиума</b><span>Обогащение</span></div>
    <div class="mcard"><div class="av">•</div><b>Член Президиума</b><span>Геология</span></div>
    <div class="mcard"><div class="av">•</div><b>Член Президиума</b><span>Безопасность</span></div>
  </div>
</div></section>
</main>

<div id="kn-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
